<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特等席 - カード一覧</title>
    <!-- Webフォントの読み込み -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', 'Times New Roman', 'YuMincho', '游明朝', 'MS PMincho', serif; }
        body { background-color: #070707; color: #e0e0e0; padding: 20px; line-height: 1.6; }
        .container { max-width: 900px; margin: 0 auto; padding-bottom: 50px; }
        h1 { text-align: center; color: #d4af37; margin-bottom: 10px; font-size: 24px; letter-spacing: 2px; }
        .subtitle { text-align: center; font-size: 12px; color: #bbbbbb; margin-bottom: 40px; font-family: 'Zen Kaku Gothic New', sans-serif; }
        h2 { color: #d4af37; font-size: 18px; border-bottom: 1px solid rgba(212, 175, 55, 0.4); padding-bottom: 5px; margin-top: 35px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: flex-end;}
        .count { font-size: 12px; color: #888; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: normal; }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }

        .game-card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 10px 12px 10px;
            text-align: left;
            color: #eeeeee;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 95px;
            position: relative; 
            border-radius: 2px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .game-card:hover {
            border-color: rgba(212, 175, 55, 0.5);
            background-color: #161616;
        }
        .game-card .card-name {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
            color: #f5f5f5;
        }
        .card-type {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 2px;
            width: fit-content;
            margin-bottom: 6px;
            color: #fff;
            font-weight: bold;
            display: inline-block;
        }
        .type-direct { background-color: #7d1f18; }
        .type-indirect { background-color: #1e5a34; }
        .type-cold { background-color: #1f4a63; }
        .type-harm { background-color: #964b15; }
        .type-season { background-color: #b3860f; }
        .type-obstacle { background-color: #444444; }
        .type-attachment { background-color: #ad5c77; }

        .game-card .card-info {
            font-size: 11px;
            color: #bbbbbb;
            line-height: 1.5;
            font-family: 'Zen Kaku Gothic New', sans-serif !important;
        }
        .game-card .card-cost {
            position: absolute;
            top: 0;
            right: 0;
            width: 36px;
            height: 36px;
            background-color: #444444; 
            clip-path: polygon(0 0, 100% 0, 100% 100%); 
            color: #ffffff; 
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding-right: 5px;
            padding-top: 3px;
            font-size: 14px; 
            font-weight: bold;
            margin: 0;
            transition: background-color 0.2s ease;
        }
        .game-card:hover .card-cost {
            background-color: #8c7c4a;
        }

        .category-desc {
            font-size: 12px;
            color: #999;
            margin-bottom: 12px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>特等席 - カード一覧</h1>
        <div class="subtitle">ゲーム内に登場する全カードのリストです。</div>
        
        <div id="card-lists"></div>
    </div>

        const container = document.getElementById("card-lists");
        
        categories.forEach(cat => {
            const section = document.createElement("div");
            section.innerHTML = `
                <h2>
                    <span>${cat.title}</span>
                    <span class="count">${cat.cards.length}枚</span>
                </h2>
                <div class="category-desc">${cat.desc}</div>
                <div class="card-grid">
                    ${cat.cards.map(card => `
                        <div class="game-card">
                            <div>
                                <div style="display: flex; align-items: center; margin-bottom: 3px;">
                                    <span class="card-type type-${cat.tagColor}">${cat.tagName}</span>
                                </div>

                            </div>
                            <div class="card-cost">${card.cost}</div>
                        </div>
                    `).join('')}

            `;
            container.appendChild(section);

</body>
</html>
