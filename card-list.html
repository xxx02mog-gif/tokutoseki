    <!-- Webフォントの読み込み -->

    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Georgia', 'Times New Roman', 'YuMincho', '游明朝', 'MS PMincho', serif; }
        
        /* 左右の余白を大きく確保 */
        body { background-color: #070707; color: #e0e0e0; padding: 25px; line-height: 1.5; }
        .container { max-width: 700px; margin: 0 auto; padding-bottom: 50px; }
        
        /* 大タイトル・サブタイトル */
        h1 { text-align: center; color: #d4af37; margin-bottom: 25px; font-size: 22px; letter-spacing: 2px; }
        .subtitle { text-align: center; font-size: 13px; color: #bbbbbb; margin-bottom: 5px; font-family: 'Zen Kaku Gothic New', sans-serif; }
        
        /* セクション（大見出し） */
        .section-heading {
            margin-top: 45px;
            margin-bottom: 15px;
            /* 左側のpaddingを0にし、border-leftが全体の左端にピタッと合うようにする */
            padding: 4px 10px 4px 0; 
            font-size: 16px;
            color: #f5f5f5;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.2) 0%, transparent 100%);
            border-left: 4px solid #d4af37;
            letter-spacing: 1px;
            font-weight: bold;
            /* ボーダーの内側に少しだけ隙間を開けてテキストを開始 */
            text-indent: 8px;
        }

        /* アコーディオンタイトル（小見出し）と開閉挙動 */
        details { margin-bottom: 12px; }
        details > summary { 
            list-style: none; 
            cursor: pointer; 
            outline: none; 
            padding: 4px 0; 
            display: block;
        }
        details > summary::-webkit-details-marker { display: none; }
        
        h2 { 
            color: #d4af37; 
            font-size: 14px; 
            border-bottom: 1px solid rgba(212, 175, 55, 0.4); 
            padding-bottom: 6px; 
            margin-top: 5px; 
            margin-bottom: 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            /* 変なズレの原因だったmarginを削除し、コンテナ幅いっぱいに下線を引く */
            margin-left: 0;
            margin-right: 0;
        }
        .count { font-size: 11px; color: #888; font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: normal; }

        details summary .toggle-icon {
            display: inline-block;
            transition: transform 0.2s;
            font-size: 10px;
            opacity: 0.7;
            margin-left: 6px;
        }
        details[open] summary .toggle-icon { transform: rotate(180deg); }
        
        .accordion-content { 
            padding-top: 8px; 
            padding-bottom: 15px; 
            /* コンテンツも変なインデントをなくし、左端から広く使う */
            margin-left: 0; 
            margin-right: 0;
        }
        
        .category-desc {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 14px;
            font-family: 'Zen Kaku Gothic New', sans-serif;
            line-height: 1.6;
        }

        /* カードのグリッドとスタイル（PC基準） */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
        }
        .game-card {
            background-color: #121212;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            text-align: left;
            color: #eeeeee;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            min-height: 85px;
            position: relative; 
            border-radius: 2px;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        .game-card:hover { border-color: rgba(212, 175, 55, 0.5); background-color: #161616; }
        .game-card .card-name { font-weight: bold; font-size: 14px; margin-bottom: 6px; color: #f5f5f5; line-height: 1.2; padding-right: 25px; }
        .game-card .card-info { font-size: 11px; color: #bbbbbb; line-height: 1.5; font-family: 'Zen Kaku Gothic New', sans-serif !important; }
        
        /* バッジとコスト */
        .card-type {
            font-size: 9px;
            padding: 2px 5px;
            border-radius: 2px;
            width: fit-content;
            margin-bottom: 6px;
            color: #fff;
            font-weight: bold;
            display: inline-block;
        }
        .type-direct { background-color: #7d1f18; }
        .type-indirect { background-color: #1e5a34; }
        .type-cold { background-color: #1f4a63; }
        .type-harm { background-color: #964b15; }
        .type-season { background-color: #b3860f; }
        .type-obstacle { background-color: #444444; }
        .type-attachment { background-color: #ad5c77; }
        
        .card-cost {
            position: absolute;
            top: 0;
            right: 0;
            width: 32px;
            height: 32px;
            background-color: #444444; 
            clip-path: polygon(0 0, 100% 0, 100% 100%); 
            color: #ffffff; 
            display: flex;
            align-items: flex-start;
            justify-content: flex-end;
            padding-right: 4px;
            padding-top: 2px;
            font-size: 13px; 
            font-weight: bold;
            margin: 0;
            transition: background-color 0.2s ease;
        }
  .game-card:hover .card-cost { background-color: #8c7c4a; }

       /* 特殊カード（状態異常・エンディング）用バランス調整 */
        .info-card { padding: 15px; justify-content: center; }
        .info-card .card-name { padding-right: 0 !important; margin-bottom: 8px !important; font-size: 14.5px !important; }
        .info-card .card-info { line-height: 1.6 !important; font-size: 11.5px !important; }
        
        /* アイコン表示用のラベルスタイル */
        .status-icon {
            display: block;
            width: fit-content;
            margin-bottom: 8px;
            padding: 3px 8px;
            border: 0px solid currentColor;
            border-radius: 3px;
            font-size: 11px;
            font-weight: bold;
            background-color: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.5px;
        }

        /* =========================================================
           スマホ向けレスポンシブ
           ========================================================= */
        @media (max-width: 600px) {
            body { padding: 15px 20px; } 
            h1 { font-size: 18px; margin-bottom: 20px; }
            .section-heading { font-size: 15px; padding: 4px 8px 4px 0; margin-top: 30px; margin-bottom: 12px; text-indent: 6px; }
            
           /* 見出しと説明文 */
            h2 { font-size: 13px; padding-bottom: 6px; margin-top: 5px; }
            .accordion-content { padding-bottom: 12px; }
            .category-desc { font-size: 11px; margin-bottom: 12px; line-height: 1.5; }
            
            /* カードグリッド：1列化 */
            .card-grid {
                grid-template-columns: 1fr;
                gap: 8px;
            }
            .game-card { 
                padding: 10px; 
                min-height: 75px; 
            }
            .game-card .card-name { 
                font-size: 12px; 
                margin-bottom: 4px; 
                padding-right: 20px; 
            }
            .card-type { font-size: 8px; padding: 2px 4px; margin-bottom: 4px; }
            .game-card .card-info { 
                font-size: 10px; 
                line-height: 1.4; 
            }
            
            /* コストバッジ縮小 */
            .card-cost { 
                width: 28px; 
                height: 28px; 
                font-size: 11px; 
                padding-right: 3px; 
                padding-top: 2px; 
            }

           /* 特殊カード用バランス調整（スマホ） */
            .info-card { padding: 12px; }
            .info-card .card-name { font-size: 13px !important; margin-bottom: 6px !important; }
            .info-card .card-info { font-size: 10.5px !important; }
            .status-icon { margin-bottom: 6px; padding: 2px 6px; font-size: 10px; }
        }
    </style>
</head>
